<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* 🔒 GLOBAL LINK SAFE */
a,
a:hover,
a:active,
a:visited{
  text-decoration:none !important;
  color:inherit !important;
}

body{
  background:black;
  color:white;
  text-align:center;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* BACKGROUND */
.background{
  position:fixed;
  inset:0;
  background:url('https://onebyone.site/wp-content/uploads/2025/05/360_F_958978031_JZQZFuhcBc4BvCShOBbrI3Bv1wOkX8LM-1.jpg') center/cover no-repeat;
  filter:blur(1px);
  z-index:-2;
  pointer-events:none;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:-1;
  pointer-events:none;
}

/* BUBBLES */
.bubbles span{
  position:absolute;
  bottom:-50px;
  width:20px;height:20px;
  background:rgba(255,255,255,.2);
  border-radius:50%;
  animation:rise 10s linear infinite;
}
.bubbles span:nth-child(2){width:30px;height:30px;left:20%;animation-duration:7s;}
.bubbles span:nth-child(3){width:40px;height:40px;left:40%;animation-duration:9s;}
.bubbles span:nth-child(4){width:50px;height:50px;left:60%;animation-duration:6s;}
.bubbles span:nth-child(5){width:60px;height:60px;left:80%;animation-duration:8s;}

@keyframes rise{
  0%{bottom:-50px;opacity:0}
  50%{opacity:1}
  100%{bottom:100%;opacity:0}
}

/* CONTENT */
.container{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  padding:15px;
  position:relative;
  z-index:2;
}

.blur-box{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  border-radius:15px;
  padding:25px;
  width:90%;
  max-width:420px;
  box-shadow:0 0 20px rgba(0,230,255,.6);
}

h1{
  color:#00e6ff;
  font-size:22px;
  margin-bottom:10px;
  text-transform:uppercase;
}

.timer{
  font-size:22px;
  font-weight:700;
  margin:10px 0;
}

.profile img{
  width:150px;
  height:150px;
  border-radius:50%;
  border:3px solid #00e6ff;
  box-shadow:0 0 15px #00e6ff;
  margin:10px 0;
  object-fit:cover;
}

/* BUTTON */
@keyframes shine{
  from{background-position:-200%}
  to{background-position:200%}
}
@keyframes zoom{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

.view-btn{
  display:inline-block;
  height:45px;
  line-height:45px;
  padding:0 26px;
  border-radius:35px;
  font-size:16px;
  font-weight:600;
  background:linear-gradient(45deg,#32B0ED,#3a7bd5);
  background-size:400% 400%;
  animation:shine 8s linear infinite,zoom 3s ease-in-out infinite;
  color:#fff;
  margin-top:10px;
}

.footer-text{
  font-size:13px;
  margin-top:14px;
  opacity:.85;
}

/* CREDIT */
.credit{
  position:fixed;
  bottom:10px;
  left:0;
  width:100%;
  text-align:center;
  font-size:12px;
  color:#00e6ff;
  opacity:.9;
  z-index:9999;
  pointer-events:auto;
}

.credit a{
  color:#00ffcc;
  font-weight:600;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="bubbles">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="container">
  <div class="blur-box">
    <h1>GHANSHYAM TECH<br>ART OF OPTION LEARNING</h1>

    <p>📈 Stock Market Learning – Trade Smart, Learn Deep</p>

    <div class="timer">
      <span id="countdown">3</span> SECONDS
    </div>

    <div class="profile">
      <img src="https://onebyone.site/wp-content/uploads/2026/02/gaanshyaam.jpg" alt="Ghanshyam">
    </div>

    <h2>Options • Futures • Strategy</h2>
    <p>✅ Beginner to Advanced Stock Market Education</p>

    <a href="https://t.me/+37YHWilKk-42ZThl" class="view-btn" target="_blank">
      JOIN NOW FOR FREE
    </a>

    <p class="footer-text">
      💎 Learn Before You Earn 🌍
    </p>
  </div>
</div>

<!-- ⭐ CREDIT LINE -->
<div class="credit">
  Ads managed by 
  <a href="https://t.me/+TRlJl628l-FkMWE9" target="_blank">
    @Nexgroww_agency
  </a>
</div>

<script>
let countdown = 3;

setInterval(()=>{
  document.getElementById("countdown").innerText = countdown;
  if(countdown === 0){
    // window.location.href = "https://t.me/+37YHWilKk-42ZThl";
  }
  countdown--;
},1000);
</script>

</body>
</html>
